    <rect x="266" y="110" width="230" height="70" rx="14" fill="#DBE1FF" stroke="#4A5C92" stroke-width="2"/>
    <text x="284" y="140" fill="#00174B" font-weight="700">/user/$</text><text x="482" y="140" text-anchor="end" fill="#1b7a3c" font-weight="700">✓</text>
    <text x="284" y="164" fill="#00174B" font-size="13">params = ["7"]</text>
    <rect x="266" y="194" width="230" height="52" rx="14" fill="#d9d9d9"/>
    <text x="284" y="225" fill="#555">/about</text>
