    <text x="642" y="96" text-anchor="middle" fill="#585E72" font-size="12">container (emptied)</text>
    <rect x="566" y="110" width="152" height="40" rx="12" fill="#d9d9d9"/>
    <text x="642" y="135" text-anchor="middle" fill="#000" font-weight="700">Profile of user 7</text>
    <text x="642" y="190" text-anchor="middle" fill="#00174B" font-size="13">userView(["7"], container)</text>
