<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="290" rx="18" fill="#e6e6e6"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4A5C92"/></marker></defs>
  <g font-size="14">
    <rect x="24" y="110" width="190" height="70" rx="35" fill="#4A5C92"/>
    <text x="119" y="140" text-anchor="middle" fill="#fff" font-size="13">the address is</text>
    <text x="119" y="162" text-anchor="middle" fill="#fff" font-weight="700">#/user/7</text>
    <path d="M214 145 H262" stroke="#4A5C92" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="276" y="30" fill="#000" font-weight="700">your routes, longest first</text>
    <rect x="266" y="44" width="230" height="52" rx="14" fill="#d9d9d9"/>
